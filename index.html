<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Електронний курс для вчителів 1-4 класів: безпечні сервіси, інтерактивні вправи, співпраця, гейміфікація і ШІ."><style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Цифрова скринька вчителя</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: зошит у клітинку - ліва навігація як зміст зошита, праве поле з червоною лінією полів для уроку; наліпки = відзнаки */
:root{
  --paper:#F7F9FB; --sheet:#FFFFFF; --grid:#DCE5F0; --ink:#1E3A7B; --ink-soft:#4C5F88;
  --text:#1C2433; --muted:#5B6578; --line:#E3E8F0; --margin:#D8524A;
  --sticker:#F4C33E; --sticker-ink:#4A3800; --ok:#2E7D4F; --ok-bg:#E5F3EA; --warn:#B26A00; --warn-bg:#FFF3DC;
  --bad:#B3261E; --bad-bg:#FBE9E7; --chip:#EDF1F8; --shadow:0 1px 2px rgba(20,35,70,.06),0 6px 20px rgba(20,35,70,.06);
  --f-display:"Unbounded","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161F; --sheet:#171E2A; --grid:#232D3D; --ink:#9DB6F2; --ink-soft:#8DA0C8;
  --text:#E4E8F0; --muted:#9AA4B6; --line:#2A3446; --margin:#E8766E;
  --sticker:#E9B830; --sticker-ink:#2A2000; --ok:#6FCB94; --ok-bg:#16301F; --warn:#F0B35A; --warn-bg:#33270F;
  --bad:#F28B82; --bad-bg:#3A1A18; --chip:#212A3A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161F; --sheet:#171E2A; --grid:#232D3D; --ink:#9DB6F2; --ink-soft:#8DA0C8;
  --text:#E4E8F0; --muted:#9AA4B6; --line:#2A3446; --margin:#E8766E;
  --sticker:#E9B830; --sticker-ink:#2A2000; --ok:#6FCB94; --ok-bg:#16301F; --warn:#F0B35A; --warn-bg:#33270F;
  --bad:#F28B82; --bad-bg:#3A1A18; --chip:#212A3A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--text);font:16px/1.6 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:var(--ink)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sticker);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
h1{font:700 clamp(1.5rem,3.2vw,2.2rem)/1.2 var(--f-display);color:var(--ink);letter-spacing:-.01em}
h2{font:600 1.35rem/1.3 var(--f-body);color:var(--ink)}
h3{font:600 1.08rem/1.35 var(--f-body)}
p{margin:0}
.eyebrow{font:600 .74rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--margin)}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:34px;height:34px;border-radius:8px;flex:none;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/7px 7px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/7px 7px,var(--sheet);
  border:1.5px solid var(--ink);position:relative}
.brand-mark::after{content:"";position:absolute;left:8px;top:0;bottom:0;width:1.5px;background:var(--margin)}
.brand b{font:700 .95rem/1.1 var(--f-display)}
.brand span{display:block;font-size:.75rem;color:var(--muted)}
.top-stats{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:.84rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.route{background:var(--sticker);color:var(--sticker-ink)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 10px;cursor:pointer}

/* shell */
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.side h4{font:600 .72rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 0 6px}
.side a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);padding:6px 8px;border-radius:7px;font-size:.92rem;line-height:1.3}
.side a:hover{background:var(--chip)}
.side a.on{background:var(--chip);color:var(--ink);font-weight:600}
.side a.mod{font-weight:600}
.side a.les{padding-left:22px;font-size:.88rem;color:var(--muted)}
.side a.les.on{color:var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;line-height:1}
.dot.done{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.dot.lock{border-style:dashed}
.mbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:2px 8px 6px 32px}
.mbar i{display:block;height:100%;background:var(--ok)}

main{min-width:0}
.sheet{background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(18px,3.5vw,40px);position:relative}
.sheet.lined{padding-left:clamp(30px,5vw,64px)}
.sheet.lined::before{content:"";position:absolute;top:0;bottom:0;left:clamp(16px,3vw,40px);width:1.5px;background:var(--margin);opacity:.55}
.stack{display:flex;flex-direction:column;gap:18px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.prose ul,.prose ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.hero{background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--sheet);
  border-radius:var(--r);padding:clamp(20px,4vw,44px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .lead{font-size:1.1rem;max-width:60ch;color:var(--text)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fact b{display:block;font:700 1.1rem/1.2 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.fact span{font-size:.82rem;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.soft{background:var(--chip);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--sheet);display:flex;flex-direction:column;gap:8px;min-width:0}
.card.link{text-decoration:none;color:inherit;cursor:pointer}
.card.link:hover{border-color:var(--ink)}
.rn{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline}
.rn b{font:700 .8rem/1 var(--f-display);color:var(--margin);white-space:nowrap}
.tag{display:inline-block;font-size:.75rem;font-weight:600;border-radius:5px;padding:2px 7px;background:var(--chip);color:var(--ink-soft)}
.tag.opt{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink);background:var(--chip)}
.note{border-radius:8px;padding:12px 14px;background:var(--chip);font-size:.93rem}
.note.safe{background:var(--warn-bg);color:var(--text)}
.note.safe b:first-child{color:var(--warn)}
.note.good{background:var(--ok-bg)}
.note.bad{background:var(--bad-bg)}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.crumb{font-size:.85rem;color:var(--muted)}
.crumb a{color:var(--muted)}

/* quiz */
.quiz{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.q{display:flex;flex-direction:column;gap:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--sheet);text-align:left}
.opt:hover{border-color:var(--ink-soft)}
.opt.sel{border-color:var(--ink);background:var(--chip)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:.92rem;border-radius:8px;padding:10px 12px}
.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--bad-bg)}

/* stickers / badges */
.stickers{display:flex;flex-wrap:wrap;gap:14px}
.sticker{width:112px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.8rem;line-height:1.25}
.sticker .s{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:var(--sticker);color:var(--sticker-ink);
  font:700 1.5rem/1 var(--f-display);box-shadow:0 2px 0 rgba(0,0,0,.12);transform:rotate(-6deg);border:3px solid var(--sheet);outline:1.5px solid var(--sticker)}
.sticker.off .s{background:transparent;color:var(--muted);outline:1.5px dashed var(--muted);transform:none;box-shadow:none}
.sticker.off{color:var(--muted)}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl-bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.lvl-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ink),var(--ink-soft))}

/* interactive */
.scene{border:1.5px solid var(--ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.scene .who{font:700 .78rem/1 var(--f-display);color:var(--margin);letter-spacing:.04em}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bin{border:1.5px dashed var(--ink-soft);border-radius:8px;padding:10px;min-height:90px;display:flex;flex-direction:column;gap:6px}
.bin h5{margin:0;font-size:.85rem;color:var(--ink)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.token{border:1px solid var(--ink-soft);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.token.sel{background:var(--ink);color:var(--sheet)}
.token.right{border-color:var(--ok);background:var(--ok-bg)} .token.wrong{border-color:var(--bad);background:var(--bad-bg)}
.post{border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:440px;background:var(--sheet)}
.post-h{display:flex;gap:8px;align-items:center;padding:10px 12px;font-size:.88rem}
.post-h i{width:30px;height:30px;border-radius:50%;background:var(--chip);display:block}
.photo{position:relative;aspect-ratio:4/3;max-width:100%;background:linear-gradient(160deg,#9CC3E6,#C9E1B9);overflow:hidden}
.hs{position:absolute;border:2px dashed transparent;border-radius:8px;cursor:pointer;background:transparent;padding:0}
.hs:hover{border-color:rgba(255,255,255,.9)}
.hs.found{border:3px solid var(--margin);background:rgba(216,82,74,.15)}
.post-t{padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.hl{background:transparent;border:none;padding:0;cursor:pointer;color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.hl.found{background:var(--bad-bg);text-decoration:none;outline:2px solid var(--margin);border-radius:3px}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input[type=text],textarea,select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--sheet);font-weight:400;width:100%}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;cursor:pointer}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--ink);flex:none}
.prompt{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.92rem;position:relative;white-space:pre-wrap}
.prompt .copy{position:absolute;top:8px;right:8px;font-size:.78rem;padding:4px 9px}
.prompt b.n{color:var(--margin);font-family:var(--f-display);font-size:.8rem}

/* board */
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.idea{border-radius:8px;padding:14px;background:var(--warn-bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.idea .meta{font-size:.78rem;color:var(--muted)}
.cm{font-size:.85rem;border-top:1px solid var(--line);padding-top:6px}

/* assistant */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--sheet);border:none;border-radius:999px;padding:12px 18px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.fab .eye{width:22px;height:22px;border-radius:50%;background:var(--sticker);display:grid;place-items:center;color:var(--sticker-ink);font:700 .7rem/1 var(--f-display)}
.panel{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:min(400px,calc(100vw - 32px));
  max-height:min(620px,calc(100vh - 120px));background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.panel-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-b{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;flex:1}
.msg{padding:9px 12px;border-radius:10px;font-size:.92rem;max-width:92%;white-space:pre-wrap}
.msg.me{background:var(--ink);color:var(--sheet);align-self:flex-end}
.msg.ai{background:var(--chip);align-self:flex-start}
.panel-f{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
.panel-f textarea{min-height:44px;max-height:120px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer}

.banner{border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.banner.info{background:var(--chip)} .banner.warn{background:var(--warn-bg)} .banner.ok{background:var(--ok-bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--text);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.92rem}
.spark{display:flex;align-items:flex-end;gap:3px;height:48px}
.spark i{flex:1;background:var(--ink-soft);border-radius:2px 2px 0 0;min-height:2px}
.rub td:first-child{font-weight:600}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:static;max-height:none;display:none;background:var(--sheet);border-radius:var(--r);padding:8px 12px;box-shadow:var(--shadow)}
  nav.side.open{display:block}
  .menu-btn{display:inline-block}
  .brand span{display:none}
  .top{position:static}
  .top-stats{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 "РН2":"Створює інтерактивну вправу з автоматичною перевіркою щонайменше з 8 завдань для конкретного уроку НУШ.",
 "РН3":"Розробляє інструкцію до спільної онлайн-активності учнів з чіткими ролями і правилами.",
 "РН4":"Застосовує ланцюжок запитів до генеративного ШІ для створення матеріалів різного рівня складності і перевіряє їх на фактичні помилки та відповідність віку.",
 "РН5":"Розробляє план цифрового уроку, що інтегрує щонайменше три інструменти, і пояснює педагогічну доцільність кожного."

{id:"s-1",mod:"m0",title:"Як працює курс",min:10,type:"text",xp:10,body:`
<p>Курс складається з коротких уроків по 10-15 хвилин. Кожен урок закінчується <b>практичним кроком</b> - маленькою дією для вашого справжнього уроку. Саме практичні кроки, а не прочитаний текст, наближають вас до фінального проєкту.</p>
<h3>Що де знаходиться</h3>
<ul>
<li><b>Ліворуч</b> - зміст курсу. Зелена позначка означає, що урок завершено.</li>
<li><b>Угорі</b> - ваші бали, рівень і маршрут.</li>
<li><b>Кнопка "Помічник"</b> внизу праворуч - ШІ-помічник курсу. Він пояснює і підказує, але не виконує завдання за вас.</li>
<li><b>"Мій прогрес"</b> - статистика, відзнаки і персональні поради.</li>
</ul>
<h3>Маршрути</h3>
<p>Після вхідної діагностики курс призначить вам маршрут. <b>"Новачок"</b> отримує покрокові підказки до кожного практичного завдання. <b>"Практик"</b> - додаткові завдання підвищеної складності. Маршрут можна змінити будь-коли на сторінці прогресу.</p>
<h3>Умови завершення</h3>
<ul>
<li>завершено щонайменше 80% уроків;</li>
<li>виконано практичні завдання модулів 1-4;</li>
<li>подано фінальний проєкт і оцінено два проєкти колег.</li>
</ul>
<p>Орієнтовне навантаження - 30 годин за 4 тижні, тобто 2-3 короткі сесії на тиждень.</p>`,
quiz:[{q:"Що в курсі є головним доказом навчання?",opts:["Кількість прочитаних уроків","Практичні кроки і фінальний проєкт","Час, проведений у курсі"],a:1,why:"Курс перевіряє дії: створену вправу, інструкцію, перевірений ШІ-матеріал. Прочитати можна і без розуміння."}]},
{id:"s-2",mod:"m0",title:"Вхідна діагностика",min:5,type:"diag",xp:10},

{id:"1-1",mod:"m1",title:"Цифровий клас: мінімум, який працює",min:12,type:"text",xp:10,body:`
<p>Цифрове середовище класу - це не набір усіх модних сервісів, а 3-4 інструменти, кожен з яких закриває одну задачу. Чим менше точок входу, тим менше плутаються діти й батьки.</p>
<table><tr><th>Задача</th><th>Що використати</th><th>Навіщо саме це</th></tr>
<tr><td>Матеріали і завдання</td><td>Google Classroom</td><td>Одне місце для всього, працює з телефону, акаунт учня створює школа</td></tr>
<tr><td>Зв'язок з батьками</td><td>ClassDojo або офіційний чат класу</td><td>Повідомлення і фото діяльності без особистих номерів учителя</td></tr>
<tr><td>Інтерактив на уроці</td><td>Wordwall, LearningApps</td><td>Вправи з автоперевіркою без реєстрації учнів</td></tr>
<tr><td>Спільна робота</td><td>Padlet</td><td>Дошка, на яку діти додають ідеї за посиланням</td></tr>
</table>
<p>Перевірте себе питанням: <i>чи може другокласник відкрити це з телефону мами за одне натискання?</i> Якщо для цього потрібен логін, пароль і підтвердження пошти - сервіс не для учнів, а для вас.</p>`,
step:"Випишіть сервіси, якими зараз користується ваш клас. Позначте, яку задачу закриває кожен. Чи є два сервіси для однієї задачі?",
novice:"Почніть з простого: відкрийте телефон і подивіться, які освітні застосунки і чати ви використовували за останній тиждень.",
quiz:[{q:"Учитель використовує для домашніх завдань і Classroom, і Viber, і email. Що найімовірніше станеться?",opts:["Батьки отримають завдання тричі і будуть задоволені","Частина завдань загубиться, бо незрозуміло, де шукати","Нічого, дублювання - це надійність"],a:1,why:"Кілька каналів для однієї задачі створюють плутанину. Краще один канал для завдань і один - для зв'язку."},
{q:"Який критерій найважливіший для сервісу, яким користуються самі учні 1-4 класів?",opts:["Красивий дизайн","Вхід без реєстрації або через шкільний акаунт","Наявність ШІ"],a:1,why:"Діти до 13 років не можуть самостійно реєструватися в більшості сервісів, і кожен зайвий крок входу забирає час уроку."}]},
{id:"1-2",mod:"m1",title:"Вік 13+ і згода батьків",min:12,type:"text",xp:10,body:`
<p>Більшість популярних сервісів у своїх умовах використання дозволяють самостійну реєстрацію лише з 13 років. Це стосується YouTube-акаунтів, Canva, ChatGPT, соцмереж. Учень 2 класу в такому сервісі - порушення умов, навіть якщо реєстрацію зробив учитель.</p>
<h3>Три категорії сервісів</h3>
<ul>
<li><b>Можна учням без реєстрації</b> - учні відкривають вправу за посиланням або кодом (Wordwall, LearningApps, Kahoot у режимі гри, Padlet за посиланням).</li>
<li><b>Через шкільний або батьківський акаунт</b> - Google Classroom з акаунтом Google Workspace for Education, ClassDojo з кодом від учителя.</li>
<li><b>Тільки для вчителя</b> - ChatGPT, Gemini, Canva AI, генератори зображень. Учитель готує матеріал, діти бачать результат.</li>
</ul>
<div class="note safe"><b>Безпека.</b> Якщо сервіс потрібен дітям, але вимагає 13+, використовуйте режим "для класу" або акаунт школи. Інакше - тільки вчитель.</div>`,
step:"Перевірте один сервіс, яким користуються ваші учні: знайдіть в умовах використання мінімальний вік (шукайте слова age, 13, children).",
novice:"Відкрийте сайт сервісу, прокрутіть до низу сторінки і знайдіть посилання Terms або Умови. Натисніть Ctrl+F і введіть 13.",
quiz:[{q:"Учитель хоче, щоб учні 3 класу самі генерували картинки в Canva AI. Як правильно?",opts:["Зареєструвати кожного учня на свою пошту","Використати Canva for Education через школу або генерувати самому","Дозволити, бо це освіта"],a:1,why:"Самостійна реєстрація дітей до 13 років порушує умови. Освітні версії через школу або генерація вчителем - коректні варіанти."},
{q:"До якої категорії належить Wordwall-вправа, відкрита учнем за посиланням?",opts:["Тільки для вчителя","Через шкільний акаунт","Можна учням без реєстрації"],a:2,why:"Учень проходить вправу без акаунта, тож вікове обмеження реєстрації не застосовується."}]},
{id:"1-3",mod:"m1",title:"Дані й фото учнів",min:12,type:"text",xp:10,body:`
<p>Фото з уроку в чаті класу здається дрібницею, поки воно не опиняється у відкритому доступі разом з іменем дитини, назвою школи і геотегом. Ці чотири речі разом дозволяють знайти дитину.</p>
<h3>Правило чотирьох "ні" для публікацій</h3>
<ol>
<li>Ні повних іменах і прізвищах під фото.</li>
<li>Ні впізнаваних обличчях без письмової згоди батьків (краще - руки, роботи, спина).</li>
<li>Ні назві школи і класу в кадрі (вивіска, табличка на дверях).</li>
<li>Ні геолокації в публікації.</li>
</ol>
<p>Окремо - журнал і оцінки. Вони не потрапляють у загальні чати і в запити до ШІ. Якщо хочете попросити ШІ допомогти з характеристикою учня, замініть ім'я на "Учень А" і приберіть усе, що його ідентифікує.</p>`,
step:"Перегляньте останні 5 фото, які ви або батьки публікували в чаті класу. Скільки з них пройшли б правило чотирьох \"ні\"?",
quiz:[{q:"Який варіант публікації фото з уроку найбезпечніший?",opts:["Обличчя дітей, підпис \"3-Б, школа №12, Ірпінь\"","Руки дітей з виробами, без підпису з місцем","Групове фото з іменами, але без геотегу"],a:1,why:"Руки й роботи показують результат уроку і не ідентифікують дитину."}]},
{id:"1-4",mod:"m1",title:"Тренажер: безпечний вибір сервісу",min:15,type:"sim",xp:30},
{id:"1-t",mod:"m1",title:"Завдання: чекліст безпечного сервісу",min:20,type:"task",xp:20,body:`
<p>Оберіть один реальний сервіс, який ви хочете використовувати з класом, і пройдіть чекліст. Результат - заповнений чекліст з коротким висновком: використовувати з учнями, тільки самому, або відмовитись.</p>`,
checklist:["Я знаю мінімальний вік за умовами використання","Учні можуть працювати без власної реєстрації, або є шкільна версія","Сервіс не вимагає імен, фото чи інших даних дітей","Я розумію, де зберігаються створені матеріали і хто їх бачить","Сервіс працює з телефону і при слабкому інтернеті","Сервіс закриває конкретну задачу мого уроку, а не просто \"цікавий\""],
field:"Висновок: сервіс, рішення і чому (2-3 речення)",
novice:"Візьміть для початку Wordwall: у нього прості умови і учні працюють без реєстрації.",
pro:"Порівняйте два сервіси для однієї задачі (наприклад, Wordwall і LearningApps) і обґрунтуйте, чому обираєте один."},

{id:"2-1",mod:"m2",title:"Шість типів вправ і для чого кожен",min:12,type:"text",xp:10,body:`
<p>Інтерактивна вправа - це не "гра заради гри". Тип вправи обирають під дію, яку має виконати учень.</p>
<table><tr><th>Тип</th><th>Яку дію тренує</th><th>Приклад для початкової школи</th></tr>
<tr><td>Знайди пару</td><td>Пов'язувати поняття</td><td>Слово - малюнок, приклад - відповідь</td></tr>
<tr><td>Сортування на групи</td><td>Класифікувати</td><td>Живе / неживе, голосні / приголосні</td></tr>
<tr><td>Пропущене слово</td><td>Застосовувати правило</td><td>Вставити закінчення, знак у прикладі</td></tr>
<tr><td>Послідовність</td><td>Впорядковувати</td><td>Етапи росту рослини, план оповідання</td></tr>
<tr><td>Вікторина</td><td>Відтворювати і розпізнавати</td><td>Таблиця множення, факти про тварин</td></tr>
<tr><td>Розгалужена історія</td><td>Обирати рішення</td><td>Правила поведінки, безпека в мережі</td></tr>
</table>
<p>Порада: вікторина - найпростіша у створенні, тому її використовують найчастіше. Але вона тренує лише пригадування. Якщо мета уроку - "класифікує", візьміть сортування.</p>`,
step:"Візьміть тему свого наступного уроку і запишіть: яку дію має виконати учень і який тип вправи для цього підходить.",
quiz:[{q:"Мета уроку: \"учень розрізняє іменники, прикметники і дієслова\". Який тип вправи найкращий?",opts:["Вікторина з одним правильним варіантом","Сортування слів на три групи","Розгалужена історія"],a:1,why:"Розрізняти - це класифікувати. Сортування прямо тренує цю дію."},
{q:"Чому розгалужена історія підходить для теми безпеки в мережі?",opts:["Бо вона найкоротша","Бо учень обирає рішення і бачить його наслідки","Бо не потребує тексту"],a:1,why:"У безпеці важливе рішення в ситуації, а розгалуження його і моделює."}]},
{id:"2-2",mod:"m2",title:"Вправа для дітей 6-10 років",min:10,type:"text",xp:10,body:`
<p>Дорослий легко пробачає дрібний шрифт і довгу інструкцію. Першокласник - ні, він просто натисне навмання.</p>
<ul>
<li><b>Одна вправа - одна дія.</b> Не змішуйте сортування і введення тексту.</li>
<li><b>8-12 завдань.</b> Менше - не тренує, більше - втомлює.</li>
<li><b>Інструкція в одне речення</b>, для 1 класу - ще й голосом учителя.</li>
<li><b>Великий шрифт і картинки</b> там, де діти ще погано читають.</li>
<li><b>Зворотний зв'язок</b> одразу після відповіді, а не в кінці.</li>
<li><b>Перевірте з телефону</b>: багато дітей виконують домашні завдання саме з нього.</li>
</ul>`,
step:"Згадайте одну вправу, яку ви давали дітям. Що з цього списку в ній порушено?",
quiz:[{q:"Скільки завдань оптимально для однієї вправи в 2 класі?",opts:["3-4","8-12","25-30"],a:1,why:"Достатньо для тренування і не перевантажує увагу."}]},
{id:"2-3",mod:"m2",title:"LearningApps і Wordwall покроково",min:15,type:"text",xp:10,body:`
<h3>Wordwall</h3>
<ol><li>Зареєструйтеся як учитель на wordwall.net (безкоштовно - до 5 вправ).</li>
<li>"Створити вправу" → оберіть шаблон ("Знайди пару", "Сортування за групами", "Вікторина").</li>
<li>Введіть завдання. Для малюків додайте зображення до кожного.</li>
<li>"Готово" → "Поділитися" → "Призначити учням". Скопіюйте посилання.</li>
<li>Результати учнів з'являться у вкладці "Мої результати".</li></ol>
<h3>LearningApps</h3>
<ol><li>Зареєструйтеся на learningapps.org (повністю безкоштовно).</li>
<li>"Створити вправу" → оберіть тип → "Створити нову вправу".</li>
<li>Заповніть назву, інструкцію і завдання, додайте відгук для правильної відповіді.</li>
<li>"Показати попередній перегляд" → "Зберегти вправу" → скопіюйте посилання.</li></ol>
<p>Різниця: у Wordwall одну вправу можна одним натисканням перемкнути на інший шаблон (пари → вікторина). LearningApps безкоштовний без обмежень, але інтерфейс старіший.</p>`,
step:"Створіть акаунт в одному з сервісів і відкрийте шаблон, який обрали в уроці 2-1.",
novice:"Почніть з шаблону \"Вікторина\" у Wordwall: у ньому найменше налаштувань. Потім змініть шаблон на інший кнопкою \"Змінити шаблон\".",
quiz:[{q:"Яка перевага Wordwall для вчителя, у якого мало часу?",opts:["Вправу можна перемкнути на інший шаблон без повторного введення","Він повністю безкоштовний без обмежень","Він не потребує інтернету"],a:0,why:"Один набір завдань - кілька форматів вправ."}]},
{id:"2-t",mod:"m2",title:"Завдання: моя інтерактивна вправа",min:40,type:"task",xp:30,body:`
<p>Створіть інтерактивну вправу з автоматичною перевіркою для свого реального уроку і вставте посилання. Перевірте її за чеклістом.</p>`,
checklist:["Вправа відповідає меті конкретного уроку","У вправі щонайменше 8 завдань","Інструкція вміщується в одне речення","Відповідь перевіряється автоматично","Я відкрив(ла) вправу з телефону і все працює","Вправа не вимагає від учнів реєстрації"],
field:"Посилання на вправу і тема уроку",
novice:"Не прагніть ідеалу: 8 завдань у шаблоні \"Знайди пару\" - вже повноцінна вправа.",
pro:"Зробіть дві версії вправи - базову і ускладнену - для диференціації в класі."},

/* ---------- M3 ---------- */
{id:"3-1",mod:"m3",title:"Спільна робота онлайн: пари, групи, карусель",min:12,type:"text",xp:10,body:`
<p>Співпраця - це коли без відповіді іншого твоя частина не має сенсу. Якщо кожен учень просто кидає свою відповідь на дошку, це паралельна робота, а не спільна.</p>
<h3>Три моделі, які працюють у початковій школі</h3>
<ul>
<li><b>Пари "автор - читач".</b> Один пише речення, другий ставить запитання до нього. Потім міняються.</li>

{id:"4-1",mod:"m4",title:"Як працює генеративний ШІ і де помиляється",min:12,type:"text",xp:10,body:`
<p>Мовна модель не шукає відповідь у базі. Вона продовжує текст найімовірнішими словами, спираючись на те, що бачила під час навчання. Тому відповідь завжди звучить впевнено - навіть коли вона вигадана.</p>

<p>Далі - не одне повідомлення, а діалог: "скороти", "заміни слово X на простіше", "зроби версію для сильніших учнів".</p>

{id:"start",t:"Перший крок",s:"1",d:"Пройти вхідну діагностику"},
{id:"safe",t:"Безпечний клас",s:"13+",d:"Завершити тренажер вибору сервісу"},
{id:"maker",t:"Творець вправ",s:"8+",d:"Здати власну інтерактивну вправу"},
{id:"team",t:"Командний гравець",s:"+2",d:"Додати ідею і 2 коментарі на дошці"},
{id:"quest",t:"Квест пройдено",s:"3/3",d:"Виконати всі кроки квесту тижня"},
{id:"fact",t:"Детектор вигадок",s:"?!",d:"Перевірити три твердження ШІ"},
{id:"ai",t:"Пілот ШІ",s:"ШІ",d:"Виконати активність з текстами трьох рівнів"},
{id:"final",t:"Мій цифровий урок",s:"30г",d:"Подати фінальний проєкт"}
];
const LEVELS=[[0,"Стажер"],[80,"Практик"],[180,"Майстер"],[300,"Наставник"]];
/* ===== state ===== */
const KEY="dts-course-v1";
const DEF=()=>({xp:0,done:{},quiz:{},route:null,diag:null,tasks:{},sim:{},board:{},quest:{},ai:{},fact:{},final:{},peer:[{},{}],refl:{},badges:{},log:[],steps:{},helperUses:0,start:null,hintsShown:0});
let S=DEF();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(DEF(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
function logAct(id){const d=today();if(!S.start)S.start=d;S.log.push({d,id});if(S.log.length>500)S.log=S.log.slice(-500);save();}
if(!S.start){S.start=today();save();}
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=id=>COURSE.lessons.find(l=>l.id===id);
const M=id=>COURSE.modules.find(m=>m.id===id);
const modLessons=mid=>COURSE.lessons.filter(l=>l.mod===mid);
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;el.setAttribute("role","status");document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}
function addXP(n,why){S.xp+=n;save();renderTop();if(why)toast(`+${n} балів - ${why}`);}
function badge(id){if(S.badges[id])return;S.badges[id]=today();save();const b=BADGES.find(x=>x.id===id);toast(`Нова відзнака: ${b.t}`);}
function complete(id){if(S.done[id])return;S.done[id]=today();logAct(id);addXP(L(id).xp||10,"урок завершено");render();}
function level(){let cur=LEVELS[0],next=null;for(let i=0;i<LEVELS.length;i++){if(S.xp>=LEVELS[i][0]){cur=LEVELS[i];next=LEVELS[i+1]||null;}}return{name:cur[1],from:cur[0],next};}
function modPct(mid){const ls=modLessons(mid);return Math.round(100*ls.filter(l=>S.done[l.id]).length/ls.length);}
const coursePct=()=>Math.round(100*COURSE.lessons.filter(l=>S.done[l.id]).length/COURSE.lessons.length);
const tasksDone=()=>["1-t","2-t","3-b","4-a"].filter(id=>S.done[id]).length;
const finalUnlocked=()=>tasksDone()>=3;
const questUnlocked=()=>S.done["3-1"]&&S.done["3-2"];

/* ===== personalization rules (ПР13) ===== */
function advice(){
  const a=[];
  if(!S.diag) a.push({k:"info",t:"Почніть з вхідної діагностики - вона налаштує курс під ваш рівень.",go:"l-s-2",b:"Пройти діагностику"});
  const days=S.log.length?Math.floor((Date.now()-new Date(S.log[S.log.length-1].d))/864e5):0;
  if(S.log.length&&days>=3) a.push({k:"warn",t:`Вас не було ${days} дн. Щоб не випасти з ритму, відкрийте наступний короткий урок - це 10-15 хвилин.`,go:"l-"+nextLesson(),b:"Продовжити"});
  for(const [lid,q] of Object.entries(S.quiz)){ if(q.total&&q.solved&&q.solved.filter(Boolean).length===q.total&&q.firstOk/q.total<0.6){a.push({k:"warn",t:`У самоперевірці уроку "${L(lid).title}" менше 60% правильних з першої спроби. Перегляньте урок ще раз або запитайте Помічника.`,go:"l-"+lid,b:"Повторити урок"});break;}}
  if(S.route==="novice"&&modPct("m1")===100&&modPct("m2")===100&&quizAcc()>=.8) a.push({k:"ok",t:"Ви впевнено пройшли два модулі. Можете перейти на маршрут \"Практик\" і отримувати завдання підвищеної складності.",go:"progress",b:"Змінити маршрут"});
  if(S.done["2-t"]&&S.route==="pro"&&!S.steps["2-t-pro"]) a.push({k:"info",t:"Для маршруту \"Практик\": зробіть другу, ускладнену версію своєї вправи для диференціації.",go:"l-2-t",b:"До завдання"});
  if(tasksDone()===2) a.push({k:"info",t:"Ще одне практичне завдання - і відкриється фінальний проєкт.",go:"l-"+(["1-t","2-t","3-b","4-a"].find(i=>!S.done[i])),b:"Наступне завдання"});
  if(S.done["5-p"]&&!(S.peer[0].done&&S.peer[1].done)) a.push({k:"warn",t:"Проєкт подано. Залишилось оцінити два проєкти колег.",go:"l-5-p",b:"Оцінити колег"});
  return a;
}
function nextLesson(){const l=COURSE.lessons.find(l=>!S.done[l.id]);return l?l.id:"5-r";}

/* ===== top + nav ===== */
function renderTop(){
  const lv=level();
  $("#stats").innerHTML=`<span class="chip" title="Бали">${S.xp} балів</span><span class="chip" title="Рівень">${lv.name}</span>${S.route?`<span class="chip route">${S.route==="pro"?"Практик":"Новачок"}</span>`:""}<a class="chip" href="#progress">Мій прогрес ${coursePct()}%</a>`;
}
function renderNav(cur){
  let h=`<a href="#home" class="${cur==="home"?"on":""}">Про курс</a><a href="#map" class="${cur==="map"?"on":""}">Карта і траєкторія</a><a href="#progress" class="${cur==="progress"?"on":""}">Мій прогрес</a>`;
  for(const m of COURSE.modules){
    h+=`<h4>${m.n}</h4><a class="mod ${cur===m.id?"on":""}" href="#${m.id}">${esc(m.title)}</a><div class="mbar"><i style="width:${modPct(m.id)}%"></i></div>`;
    for(const l of modLessons(m.id)){
      const lock=(l.id==="5-p"||l.id==="5-r")&&!finalUnlocked()&&!S.done[l.id];
      h+=`<a class="les ${cur==="l-"+l.id?"on":""}" href="#l-${l.id}"><span class="dot ${S.done[l.id]?"done":lock?"lock":""}">${S.done[l.id]?"✓":""}</span>${esc(l.title)}</a>`;
    }
  }
  $("#nav").innerHTML=h;
}

   <div class="facts">${ind.map(i=>`<div class="fact"><span>${i[0]}</span><b>${i[1]}</b><span>${i[2]}</span></div>`).join("")}</div>

   <h2>Модулі</h2>
   <div class="stack-s">${COURSE.modules.map(m=>`<div><div class="small" style="display:flex;justify-content:space-between"><span>${m.n}. ${esc(m.title)}</span><span class="muted">${modPct(m.id)}%</span></div><div class="lvl-bar" style="height:8px"><i style="width:${modPct(m.id)}%;background:var(--ok)"></i></div></div>`).join("")}</div>

/* ===== text lesson ===== */
function lText(l){
  const st=S.steps[l.id];
  return `<div class="prose">${l.body}</div>${routeHints(l)}
  ${l.step?`<div class="card"><span class="eyebrow">Практичний крок</span><p>${l.step}</p><label class="check"><input type="checkbox" id="step-${l.id}" ${st?"checked":""} data-step="${l.id}"> Зроблено для мого класу (+5 балів)</label></div>`:""}
  ${quizHTML(l)}
  ${S.done[l.id]?"":`<div class="btns"><button class="btn" data-complete="${l.id}" ${quizPassed(l)?"":"disabled"}>Завершити урок</button>${quizPassed(l)?"":`<span class="small muted">Спершу дайте правильні відповіді в самоперевірці</span>`}</div>`}`;
}
function quizPassed(l){if(!l.quiz)return true;const q=S.quiz[l.id];return q&&q.solved&&q.solved.length===l.quiz.length&&q.solved.every(Boolean);}
function quizHTML(l){
  if(!l.quiz)return "";const q=S.quiz[l.id]||{};
  return `<div class="quiz" id="quiz-${l.id}"><span class="eyebrow">Самоперевірка</span>${l.quiz.map((x,i)=>{
    const solved=q.solved&&q.solved[i];const last=q.last&&q.last[i];
    return `<div class="q"><b>${i+1}. ${x.q}</b><div class="opts" role="radiogroup">${x.opts.map((o,j)=>`<button class="opt ${solved&&j===x.a?"right":(!solved&&last===j?"wrong":"")}" data-q="${l.id}|${i}|${j}" ${solved?"disabled":""}>${o}</button>`).join("")}</div>
    ${solved?`<div class="fb ok"><b>Правильно.</b> ${x.why}</div>`:(last!=null?`<div class="fb no"><b>Не зовсім.</b> Подумайте ще: ${hintFor(x)} Спробуйте ще раз.</div>`:"")}</div>`}).join("")}</div>`;
}
function hintFor(x){return x.why.split(".")[0].replace(/^[А-ЯІЇЄҐA-Z]/,c=>c.toLowerCase())+"?";}
function answer(lid,i,j){
  const l=L(lid),x=l.quiz[i];S.quiz[lid]=S.quiz[lid]||{solved:[],last:[],tries:[],total:l.quiz.length,firstOk:0,attempts:0};
  const q=S.quiz[lid];if(q.solved[i])return;q.tries[i]=(q.tries[i]||0)+1;q.attempts++;q.last[i]=j;
  if(j===x.a){q.solved[i]=true;if(q.tries[i]===1){q.firstOk++;addXP(5,"правильна відповідь");}}
  logAct("quiz-"+lid);save();render();
}

ПІДКАЗКИ: якщо просять виконати завдання курсу (чекліст, вправу, фінальний проєкт, рефлексію) - НЕ виконуй його замість учасника. Дай план, навідні запитання або приклад на ІНШІЙ темі. Пояснюй, чому: завдання оцінює власну роботу вчителя.

КОНФІДЕНЦІЙНІСТЬ: якщо користувач надсилає імена, оцінки, діагнози чи інші дані учнів - не використовуй їх, нагадай, що такі дані не можна вводити в ШІ, і запропонуй знеособити ("Учень А").

async function ask(text){

  if(d.qnext!=null&&d.qnext!==""){const q=S.quest,n=+d.qnext;
    if(n===0&&!(q.goal||"").trim())return toast("Опишіть мету гри");
    if(n===1&&(q.m.filter(x=>x!==8).length<3||!(q.why||"").trim()))return toast("Оберіть щонайменше 3 механіки (без рейтингу) і поясніть їх");
    if(n===2&&(q.fair||[]).filter(Boolean).length<4)return toast("Перевірте всі 4 пункти");
    q.step=n+1;save();logAct("quest-"+n);addXP(10,"місію виконано");if(n===2)badge("quest");render();return;}
  /* ai */
  if("aidone" in d){const a=S.ai;if((a.c||[]).filter(Boolean).length<4||!(a.tool||"").trim()||(a.prod||"").trim().length<30)return toast("Пройдіть чекліст, вкажіть інструмент і вставте продукт");badge("ai");complete("4-a");return;}
  if("factdone" in d){const f=S.fact;if(!(f.rows||[]).every(r=>r.t&&r.v&&r.s))return toast("Заповніть фрагмент, результат і джерело для трьох тверджень");badge("fact");complete("4-f");return;}
  if(d.peer!=null&&d.peer!==""){const p=S.peer[+d.peer];if(!p.n||RUBRIC.some((_,i)=>!p["c"+i])||!(p.cm||"").trim())return toast("Заповніть назву, усі критерії і коментар");p.done=true;save();logAct("peer");addXP(10,"оцінку збережено");render();return;}
});
document.addEventListener("keydown",e=>{if(e.target.id==="h-in"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(e.target.value);e.target.value="";}
  if(e.target.dataset&&e.target.dataset.bin&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click();}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.step){const was=S.steps[d.step];S.steps[d.step]=t.checked;save();if(t.checked&&!was&&!S["xp-"+d.step]){S["xp-"+d.step]=1;addXP(d.step.endsWith("-pro")?15:5,"практичний крок");logAct("step-"+d.step);}if(d.step.startsWith("board"))render();else renderTop();return;}
  if(d.tc){const [lid,i]=d.tc.split("|");S.tasks[lid]=S.tasks[lid]||{c:[],txt:""};S.tasks[lid].c[+i]=t.checked;save();return;}
  if(d.qm){const i=+d.qm;S.quest.m=S.quest.m||[];S.quest.m=t.checked?[...new Set([...S.quest.m,i])]:S.quest.m.filter(x=>x!==i);save();render();return;}
  if(d.qfair){S.quest.fair=S.quest.fair||[];S.quest.fair[+d.qfair]=t.checked;save();return;}
  if(d.ac){S.ai.c=S.ai.c||[];S.ai.c[+d.ac]=t.checked;save();return;}
  if(d.fr){const [i,k]=d.fr.split("|");S.fact.rows[+i][k]=t.value;save();return;}
  if(d.pr){const [k,f]=d.pr.split("|");S.peer[+k][f]=t.value;save();return;}
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(d.tt){S.tasks[d.tt]=S.tasks[d.tt]||{c:[],txt:""};S.tasks[d.tt].txt=t.value;save();}
  else if(d.qf){S.quest[d.qf]=t.value;save();}
  else if(d.af){S.ai[d.af]=t.value;save();}
  else if(d.ff){S.fact[d.ff]=t.value;save();}
  else if(d.fr){const [i,k]=d.fr.split("|");S.fact.rows[+i][k]=t.value;save();}
  else if(d.fi){S.final[d.fi]=t.value;save();}
  else if(d.pr){const [k,f]=d.pr.split("|");S.peer[+k][f]=t.value;save();}
  else if(d.refl){S.refl[d.refl]=t.value;save();}
  else if(/^i-(title|tool|text|upd)$/.test(t.id)){S.board.draft=S.board.draft||{};S.board.draft[t.id.slice(2)]=t.value;save();}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
  if(f.id==="diag"){const fd=new FormData(f);let s=0;for(let i=0;i<DIAG.length;i++)s+=+(fd.get("d"+i)||0);S.diag={score:s,date:today()};S.route=s>=5?"pro":"novice";badge("start");complete("s-2");return;}
  if(f.id==="ideaForm"){submitIdea();return;}
  if(f.classList.contains("fbForm")){submitFb(f.dataset.idea,f.querySelector("textarea").value);return;}
  if(f.id==="finalForm"){const x=S.final;if(!["topic","goal","t1","t2","t3","log","refl"].every(k=>(x[k]||"").trim()))return toast("Заповніть усі поля проєкту");badge("final");complete("5-p");return;}
});

render();
</script></body></html>
